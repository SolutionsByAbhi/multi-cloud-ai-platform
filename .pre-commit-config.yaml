repos:
    -  repo:  https://github.com/antonbabenko/pre-commit-terraform
        rev:  v1.88.0
        hooks:
            -  id:  terraform_fmt
            -  id:  terraform_validate

    -  repo:  https://github.com/adrienverge/yamllint
       rev:  v1.35.1
        hooks:
            -  id:  yamllint

    -  repo:  https://github.com/psf/black
        rev:  24.4.2
        hooks:
            -  id:  black
                files:  "^services/.+\\.py$"
